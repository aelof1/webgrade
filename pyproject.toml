[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webgrade"
version = "1.0.0"
description = "Grade the security headers, cookies and TLS of a website"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
webgrade = "webgrade.cli:main"

[tool.setuptools]
packages = ["webgrade"]
